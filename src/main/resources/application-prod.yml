# Production configuration for Railway
spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:viaduct.proxy.rlwy.net}:${MYSQLPORT:21419}/${MYSQLDATABASE:railway}
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:XJWyXnWnfXUdduKRpOdTfRlMBVIvkBYb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ProductionHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false

server:
  port: ${PORT:8080}

# Logging configuration
logging:
  level:
    com.trackerpro: INFO
    org.springframework: WARN
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF

# CORS settings
cors:
  allowed-origins:
    - https://trackerpro.up.railway.app
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
  allow-credentials: true
  max-age: 3600

# JWT Configuration
jwt:
  token-validity-in-seconds: 86400
  header: Authorization
  secret: ${JWT_SECRET:your-production-jwt-secret-key-change-this}

# Application settings
app:
  client-app-url: https://trackerpro.up.railway.app
  admin-email: admin@trackerpro.com
  support-email: support@trackerpro.com
